[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "quadsim"
version = "0.1.0"
description = "Agile micro-quadrotor simulation: minimum-snap trajectories, SE(3) control, swarms"
requires-python = ">=3.9"
dependencies = [
    "numpy",
    "scipy",
    "matplotlib",
    "pillow",
]

[project.optional-dependencies]
dev = ["pytest"]
flight = ["cflib"]

[tool.setuptools]
packages = ["quadsim"]
